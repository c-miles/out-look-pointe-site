# Same as the settings in the Netlify UI. This file wins if they differ.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The rating function needs Node 18 or newer.
[build.environment]
  NODE_VERSION = "22"

# Font files never change under the same name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

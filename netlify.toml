# Same as the settings in the Netlify UI. This file wins if they differ.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Latest LTS Node. Without this Netlify keeps the site on the Node 16 it was
# created with, which is too old for the rating function.
[build.environment]
  NODE_VERSION = "lts/*"

# Font files never change under the same name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vite puts a content hash in every filename under /assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
